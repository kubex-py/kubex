# Trusted Publisher Configuration (Production PyPI)
#
# Publishes kubex when a release tag is pushed. The kubex project on PyPI needs
# this trusted publisher, at https://pypi.org/manage/project/kubex/settings/publishing/:
#   Owner:         kubex-py
#   Repository:    kubex
#   Workflow name: publish.yaml
#   Environment:   pypi
#
# kubex-core and the kubex-k8s-* model packages are released from their own
# repositories (kubex-py/kubex-core, kubex-py/k8s-1.NN).

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    # Fails unless the tag matches kubex/__version__.py and is on main.
    uses: kubex-py/.github/.github/workflows/python-build.yml@main
    with:
      check-tag: true

  # PyPI trusted publishing does not work from a reusable workflow, so this job stays here.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1.14
        with:
          attestations: true
