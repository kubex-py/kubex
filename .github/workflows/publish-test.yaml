# Trusted Publisher Configuration (Test PyPI)
#
# Publishes a .dev build of kubex for every pull request from this repository.
# The kubex project on Test PyPI needs this trusted publisher, at
#   https://test.pypi.org/manage/project/kubex/settings/publishing/:
#   Owner:         kubex-py
#   Repository:    kubex
#   Workflow name: publish-test.yaml
#   Environment:   test-pypi
#
# kubex-core and the kubex-k8s-* model packages are published from their own
# repositories (kubex-py/kubex-core, kubex-py/k8s-1.NN).

name: Publish to Test PyPI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # Pull requests from forks get no OIDC token, so they can't publish.
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: kubex-py/.github/.github/workflows/python-build.yml@main
    with:
      dev-version-file: kubex/__version__.py

  gate:
    needs: build
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      checks: read
    steps:
      - name: Wait for required checks to pass
        uses: actions/github-script@v7
        timeout-minutes: 15
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            // A name also matches matrix jobs, which are reported as
            // "<name> (<matrix values>)", e.g. "test (python 3.13)".
            const required = ['pre-commit', 'lint', 'format', 'mypy', 'test', 'docs'];
            const sleep = ms => new Promise(r => setTimeout(r, ms));

            while (true) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                per_page: 100,
              });

              const pending = [];
              const failures = [];

              for (const name of required) {
                const checks = data.check_runs.filter(
                  c => c.name === name || c.name.startsWith(`${name} (`)
                );
                if (checks.length === 0) {
                  pending.push(name);
                  continue;
                }
                for (const check of checks) {
                  if (check.status !== 'completed') {
                    pending.push(check.name);
                  } else if (check.conclusion !== 'success') {
                    failures.push(`${check.name}: ${check.conclusion}`);
                  }
                }
              }

              if (pending.length === 0) {
                if (failures.length > 0) {
                  core.setFailed(`Required checks failed: ${failures.join(', ')}`);
                } else {
                  core.info('All required checks passed');
                }
                return;
              }

              core.info(`Waiting for: ${pending.join(', ')}`);
              await sleep(15000);
            }

  publish:
    needs: [build, gate]
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: test-pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1.14
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  comment:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          DEV_VERSION: ${{ needs.build.outputs.version }}
        with:
          script: |
            const version = process.env.DEV_VERSION;
            const body = [
              '## Test PyPI package published',
              '',
              `[kubex ${version}](https://test.pypi.org/project/kubex/${version}/)`,
              '',
              'Install with:',
              '```',
              `pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ kubex==${version}`,
              '```',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
