[project]
name = "kubex"
dynamic = ["version"]
description = "Asynchronous Kubernetes client inspired by kube.rs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT License"}
authors = [
    {name = "Codemageddon", email = "dev@codemageddon.me"},
]
maintainers = [
    {name = "Codemageddon", email = "dev@codemageddon.me"},
]
dependencies = [
    "pydantic>=2.0,<3",
    "pyyaml>=6.0.2",
    # kubex-core has its own version numbers (kubex-py/kubex-core); 0.1.0b6 is the
    # first with the AdmissionReview models
    "kubex-core>=0.1.0b6,<0.2",
    "anyio>=4.6.0",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Clustering",
  "Framework :: AsyncIO",
  "Framework :: Trio",
  "Framework :: AnyIO",
  "Framework :: Pydantic :: 2",
  "Typing :: Typed",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
]

[project.urls]
Homepage = "https://kubex.codemageddon.me/"
Repository = "https://github.com/kubex-py/kubex.git"
Issues = "https://github.com/kubex-py/kubex/issues"
Changelog = "https://github.com/kubex-py/kubex/blob/main/CHANGELOG.md"
Documentation = "https://kubex.codemageddon.me/"

[project.optional-dependencies]
aiohttp = [
    "aiohttp>=3.11.2",
    "multidict>=4.5",
]
httpx = [
    "httpx>=0.27.2",
]
httpx-ws = [
    "httpx>=0.27.2",
    "httpx-ws>=0.7",
]
"k8s-1.32" = [
    "kubex-k8s-1-32",
]
"k8s-1.33" = [
    "kubex-k8s-1-33",
]
"k8s-1.34" = [
    "kubex-k8s-1-34",
]
"k8s-1.35" = [
    "kubex-k8s-1-35",
]
"k8s-1.36" = [
    "kubex-k8s-1-36",
]
"k8s-1.37" = [
    "kubex-k8s-1-37",
]
"k8s-1.38" = [
    "kubex-k8s-1-38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
namespace_packages = true
explicit_package_bases = true
plugins = [
    "pydantic.mypy"
]
[[tool.mypy.overrides]]
module = ["kubernetes_asyncio.*", "pyinstrument.*", "memray"]
ignore_missing_imports = true

[dependency-groups]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mike>=2.1",
    "pymdown-extensions>=10.11",
]
dev = [
    "kubex-k8s-1-35",
    "mypy==2.4.0",
    "pre-commit>=4.0.1",
    "pytest-cov>=5.0.0",
    "pytest>=8.3.3",
    "ruff==0.15.22",
    "testcontainers>=4.14.2",
    "trio>=0.26.2",
    "types-pyyaml>=6.0.12.20240917",
    "types-ujson>=5.10.0.20240515",
    "httpx>=0.27.2",
    "httpx-ws>=0.7",
]
benchmark = [
    "kubex-k8s-1-35",
    "kubernetes-asyncio>=35.0.0,<36",
    "memray>=1.14",
    "pytest-memray>=1.7",
    "pytest-benchmark>=4.0",
    "pyinstrument>=5.0",
    "httpx>=0.27.2",
    "aiohttp>=3.11.2",
    "trio>=0.26.2",
    "anyio>=4.6.0",
    "testcontainers>=4.8.1",
    "pyyaml>=6.0.2",
    "pytest>=8.3.3",
]

[tool.ruff.lint.isort]
known-first-party = ["kubex", "kubex_core"]

[tool.hatch.version]
path = "kubex/__version__.py"

[tool.hatch.build.targets.sdist]
only-include = ["kubex"]

[tool.hatch.build.targets.wheel]
packages = ["kubex"]

[tool.pytest.ini_options]
addopts = "--ignore=benchmarks"
